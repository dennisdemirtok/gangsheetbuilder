  <script type="module">
    // Local preview only: the app proxy and Shopify's cart are mocked.
    const realFetch = window.fetch.bind(window);
    const json = (body, status = 200) => Promise.resolve(new Response(JSON.stringify(body), { status, headers: { "Content-Type": "application/json" } }));
    window.__nnUploads = [];
    window.fetch = function (input, init) {
      const url = typeof input === "string" ? input : input.url;
      if (url.includes("/api/gang-sheet")) {
        if (init && init.method === "PUT") { window.__nnSaved = JSON.parse(init.body); localStorage.setItem("teamSaved", init.body); }
        return json({ gangSheet: { id: "gs_nn_dev" }, ok: true });
      }
      if (url.includes("/api/cart")) return json({ variantId: null, properties: { _gang_sheet_id: "gs_nn_dev", _preview_url: "" } });
      if (url.includes("/cart/add.js")) { window.__lastCartAdd = JSON.parse(init.body); localStorage.setItem("teamCart", init.body); localStorage.setItem("teamUploads", JSON.stringify(window.__nnUploads)); return json({ items: [] }); }
      return realFetch(input, init);
    };
    window.XMLHttpRequest = function () {
      const x = { upload: {}, status: 0, responseText: "" };
      x.open = (m, u) => { x.url = u; };
      x.send = async (body) => {
        const file = body.get("file");
        const bmp = await createImageBitmap(file);
        window.__nnUploads.push({ name: file.name, w: bmp.width, h: bmp.height });
        x.upload.onprogress && x.upload.onprogress({ lengthComputable: true, loaded: 1, total: 1 });
        x.upload.onload && x.upload.onload();
        await new Promise((r) => setTimeout(r, 150));
        x.status = 200;
        x.responseText = JSON.stringify({ id: "db_" + Math.random().toString(36).slice(2, 8), imageId: "img", width: bmp.width, height: bmp.height, thumbnailUrl: URL.createObjectURL(file), originalUrl: "" });
        x.onload && x.onload();
      };
      return x;
    };
    await import("/src/main.tsx");
    window.__gangsheetMountTeam(document.getElementById("team-root"));
  </script>
