<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gang Sheet Builder — Preview</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
  </style>
</head>
<body>
  <div id="gangsheet-editor-root" data-app-proxy-url="" data-shop-domain="preview.myshopify.com"></div>

  <!-- Stands in for what the theme block renders: real Shopify variants at
       200 kr/m, so the local preview exercises the storefront price path. -->
  <script id="gangsheet-variant-data" type="application/json">
    {
      "1-meter":  { "id": 57661167272310, "price": "200,00", "price_cents": 20000, "available": true, "size_key": "58x100", "title": "1 meter" },
      "2-meter":  { "id": 57666583593334, "price": "400,00", "price_cents": 40000, "available": true, "size_key": "58x200", "title": "2 meter" },
      "3-meter":  { "id": 57666583626102, "price": "600,00", "price_cents": 60000, "available": true, "size_key": "58x300", "title": "3 meter" },
      "4-meter":  { "id": 57666583658870, "price": "800,00", "price_cents": 80000, "available": true, "size_key": "58x400", "title": "4 meter" },
      "5-meter":  { "id": 57666583691638, "price": "1000,00", "price_cents": 100000, "available": true, "size_key": "58x500", "title": "5 meter" },
      "per-decimeter": { "id": 57667732472182, "price": "20,00", "price_cents": 2000, "available": true, "title": "Per decimeter" }
    }
  </script>

  <!--
    Local preview only — never shipped. The storefront loads editor.iife.js
    and calls __gangsheetMount() itself; here we stub the app proxy so the
    UI can be worked on without a backend.
  -->
  <script type="module">
    const realFetch = window.fetch.bind(window);

    function json(data) {
      return Promise.resolve(
        new Response(JSON.stringify(data), {
          status: 200,
          headers: { "Content-Type": "application/json" },
        }),
      );
    }

    // A solid PNG stands in for the uploaded artwork.
    function swatch(w, h, hue) {
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      const x = c.getContext("2d");
      x.fillStyle = `hsl(${hue} 70% 55%)`;
      x.fillRect(0, 0, w, h);
      x.fillStyle = "#fff";
      x.font = `bold ${Math.floor(Math.min(w, h) / 4)}px sans-serif`;
      x.textAlign = "center";
      x.textBaseline = "middle";
      x.fillText("TC", w / 2, h / 2);
      return c.toDataURL("image/png");
    }

    let uploadSeq = 0;
    const uploadedReal = {};
    const blackBoxRemoved = {};

    // Real logos, converted the way the upload route does (Ghostscript at
    // 300 DPI): public/test-assets/manifest.json maps a file name to the
    // server's thumbnail and pixel size. Local preview only.
    const realAssets = await realFetch("/test-assets/manifest.json")
      .then((r) => (r.ok ? r.json() : {}))
      .catch(() => ({}));

    window.fetch = function (input, init) {
      const url = typeof input === "string" ? input : input.url;

      if (url.includes("/api/pricing")) {
        return json({
          prices: {
            "58x100": { standard: 349 },
            "58x200": { standard: 629 },
            "58x300": { standard: 899 },
            "58x400": { standard: 1149 },
            "58x500": { standard: 1379 },
          },
        });
      }

      if (url.includes("/api/gang-sheet")) {
        return json({ gangSheet: { id: "gs_dev_1" }, ok: true });
      }

      if (url.includes("/api/upload")) {
        uploadSeq++;
        const body = init && init.body;
        const file = body && body.get ? body.get("file") : null;
        const hue = (uploadSeq * 67) % 360;
        // Vary the pixel size so DPI badges and sizing differ per upload.
        const w = [1200, 2400, 600][uploadSeq % 3];
        const h = [1200, 800, 600][uploadSeq % 3];
        const data = swatch(w, h, hue);
        // Text from the text tool: hand back the PNG itself, as the server
        // would, so its size and look can be checked here.
        if (file && /^(text|namn|nummer)-/.test(file.name)) {
          return createImageBitmap(file).then((bmp) => {
            const u = URL.createObjectURL(file);
            return json({
              id: "dbimg_" + Date.now().toString(36) + "_" + uploadSeq,
              imageId: "img_dev_" + Date.now().toString(36) + "_" + uploadSeq,
              filename: file.name,
              thumbnailUrl: u,
              originalUrl: u,
              width: bmp.width,
              height: bmp.height,
              dpiX: 300,
              dpiY: 300,
              hasAlpha: true,
              hasWhiteBackground: false,
              warnings: [],
            });
          });
        }
        const real = file && realAssets[file.name];
        if (real) {
          const dbId = "dbimg_" + Date.now().toString(36) + "_" + uploadSeq;
          uploadedReal[dbId] = file.name;
          return json({
            id: dbId,
            imageId: "img_dev_" + Date.now().toString(36) + "_" + uploadSeq,
            filename: file.name,
            // Absolute: the editor prefixes the app proxy path to "/…" URLs.
            thumbnailUrl: location.origin + encodeURI(real.thumb),
            originalUrl: location.origin + encodeURI(real.thumb),
            width: real.width,
            height: real.height,
            dpiX: 300,
            dpiY: 300,
            hasAlpha: real.hasAlpha,
            hasWhiteBackground: real.hasWhiteBackground,
            backgroundColor: real.hasWhiteBackground ? "#ffffff" : null,
            warnings: [],
          }).then((res) => new Promise((r) => setTimeout(() => r(res), 400 + Math.random() * 600)));
        }
        // "svart-…": white arrows on a black box, like a phone screenshot of
        // an icon — the server finds the black and the guide offers to take
        // it off.
        if (file && /^svart-/.test(file.name)) {
          const draw = (withBox) => {
            const c = document.createElement("canvas");
            c.width = 600; c.height = 1000;
            const x = c.getContext("2d");
            if (withBox) { x.fillStyle = "#111"; x.fillRect(0, 0, 600, 1000); }
            x.strokeStyle = "#fff"; x.lineWidth = 40; x.lineCap = "round"; x.lineJoin = "round";
            x.beginPath(); x.moveTo(150, 420); x.lineTo(450, 420); x.lineTo(380, 350); x.stroke();
            x.beginPath(); x.moveTo(450, 580); x.lineTo(150, 580); x.lineTo(220, 650); x.stroke();
            return c.toDataURL("image/png");
          };
          const dbId = "dbimg_" + Date.now().toString(36) + "_" + uploadSeq;
          blackBoxRemoved[dbId] = draw(false);
          return json({
            id: dbId,
            imageId: "img_dev_" + Date.now().toString(36) + "_" + uploadSeq,
            filename: file.name,
            thumbnailUrl: draw(true),
            originalUrl: draw(true),
            width: 600, height: 1000, dpiX: 300, dpiY: 300,
            hasAlpha: false,
            hasWhiteBackground: false,
            backgroundColor: "#111111",
            warnings: [],
          }).then((res) => new Promise((r) => setTimeout(() => r(res), 500)));
        }
        return json({
          // Unique across reloads: the editor keeps its designs in
          // sessionStorage, and reused ids would merge new uploads into them.
          id: "dbimg_" + Date.now().toString(36) + "_" + uploadSeq,
          imageId: "img_dev_" + Date.now().toString(36) + "_" + uploadSeq,
          filename: (file && file.name) || `design-${uploadSeq}.png`,
          thumbnailUrl: data,
          originalUrl: data,
          width: w,
          height: h,
          dpiX: 300,
          dpiY: 300,
          hasAlpha: uploadSeq % 2 === 1,
          hasWhiteBackground: uploadSeq % 2 === 0,
          warnings: [],
        }).then((res) => new Promise((r) => setTimeout(() => r(res), 700 + Math.random() * 800)));
      }

      if (url.includes("/api/remove-bg")) {
        // Real logos: the server's removal, precomputed into test-assets.
        const id = JSON.parse((init && init.body) || "{}").imageId;
        if (blackBoxRemoved[id]) {
          return new Promise((r) => setTimeout(r, 400)).then(() =>
            json({ status: "done", bgRemovedUrl: blackBoxRemoved[id] }),
          );
        }
        const realName = Object.keys(realAssets).find((n) => uploadedReal[id] === n);
        if (realName && realAssets[realName].nobg) {
          return new Promise((r) => setTimeout(r, 400)).then(() =>
            json({ status: "done", bgRemovedUrl: location.origin + encodeURI(realAssets[realName].nobg) }),
          );
        }
        // A transparent version: just the badge, no backdrop.
        const c = document.createElement("canvas");
        c.width = 600; c.height = 600;
        const x = c.getContext("2d");
        x.fillStyle = "hsl(200 70% 45%)";
        x.beginPath(); x.arc(300, 300, 240, 0, Math.PI * 2); x.fill();
        x.fillStyle = "#fff"; x.font = "bold 150px sans-serif";
        x.textAlign = "center"; x.textBaseline = "middle"; x.fillText("TC", 300, 300);
        return new Promise((r) => setTimeout(r, 500)).then(() =>
          json({ status: "done", bgRemovedUrl: c.toDataURL("image/png") }),
        );
      }

      if (url.includes("/api/auto-build")) {
        return json({ error: "mock: use local arrange" }, 500);
      }

      if (url.includes("/api/cart")) {
        return json({ variantId: "1", properties: { _gang_sheet_id: "gs_dev_1", _preview_url: "" } });
      }

      // Shopify's cart, so the whole checkout flow can be tried here. The
      // last add is kept on window.__lastCartAdd to inspect.
      if (/\/cart\.js(\?|$)/.test(url)) return json({ items: [] });
      if (url.includes("/cart/change.js")) return json({});
      if (url.includes("/cart/add.js")) {
        window.__lastCartAdd = JSON.parse((init && init.body) || "{}");
        return new Promise((r) => setTimeout(r, window.__cartDelay || 600)).then(() => json({ items: [] }));
      }

      return realFetch(input, init);
    };

    // Uploads go through XMLHttpRequest (for progress). Route them to the
    // fetch mock above, reporting progress the way a slow line would.
    window.XMLHttpRequest = function () {
      const x = { upload: {}, status: 0, statusText: "", responseText: "" };
      x.open = (method, url) => { x.url = url; };
      x.setRequestHeader = () => {};
      x.send = async (body) => {
        for (const p of [0.15, 0.4, 0.7, 1]) {
          await new Promise((r) => setTimeout(r, 180));
          x.upload.onprogress && x.upload.onprogress({ lengthComputable: true, loaded: p, total: 1 });
        }
        x.upload.onload && x.upload.onload();
        try {
          const res = await window.fetch(x.url, { method: "POST", body });
          x.status = res.status;
          x.responseText = await res.text();
          x.onload && x.onload();
        } catch (e) {
          x.onerror && x.onerror(e);
        }
      };
      return x;
    };

    await import("/src/main.tsx");
    window.__gangsheetMount();
  </script>
</body>
</html>
